name: Release

# Two ways to release ONE GitHub Release (installers for each OS + auto-update
# metadata, notes from RELEASE_NOTES.md):
#   1. Merge to main with a bumped package.json version → the gate sees that
#      `v<version>` isn't released yet and builds + publishes it (creates the tag).
#   2. Push a tag `v*` manually → always builds + publishes that tag.
# Normal pushes to main (version unchanged / already released) just run the cheap
# gate job and stop.
on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"; version="${tag#v}"; release=true
          else
            version="$(node -p "require('./package.json').version")"; tag="v$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release=false   # this version is already published
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Decision: release=$release tag=$tag version=$version"

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned macOS build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.blockmap
            release/**/latest*.yml
            !release/**/win-unpacked/**

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # NUL-delimited into an array so filenames with spaces survive; skip the
          # unpacked app tree (only the installers + update metadata get attached).
          mapfile -d '' files < <(find dist -type f -not -path '*/win-unpacked/*' \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print0)
          printf 'Attaching: %s\n' "${files[@]}"
          # On a main-triggered run this also creates the tag at the merge commit.
          gh release create "$TAG" \
            --title "Sessionflock $VERSION" \
            --notes-file RELEASE_NOTES.md \
            "${files[@]}"
